# Copia env.template a .env (en la MISMA carpeta que este compose) y
# rellena rutas + secretos ahí. Todo pasa por ${VARIABLES} de sustitución
# de Compose (abajo hay una por cada secreto) — nada de env_file con
# ruta a un fichero: con Container Manager/CLI, Compose ya carga solo el
# .env de al lado; con Portainer (Web editor/Upload), la sección
# "Environment variables" de su UI hace el mismo papel sin que haga
# falta que exista ningún fichero en el disco del NAS.
#
#   docker load -i find-video-duplicates.tar   # si te pasaron el .tar
#   docker-compose -f docker-compose-synology.yml up -d

services:
  find-video-duplicates:
    image: find-video-duplicates:latest
    container_name: find-video-duplicates
    restart: unless-stopped

    # Descomenta esto si prefieres construir la imagen directamente en
    # el Synology (repo clonado) en vez de cargar un .tar ya construido:
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile

    ports:
      # Mismo puerto a los dos lados a propósito (host y contenedor): así
      # API_PORT es la ÚNICA variable que hace falta tocar para cambiar
      # de puerto — nada que desincronizar a mano en otro sitio (el
      # healthcheck de la imagen también lee esta misma variable).
      #
      # 0.0.0.0, igual que el resto de contenedores de este NAS: el
      # Tailscale de Synology corre en modo userspace-networking (sin
      # interfaz de red real, "tailscale0" no existe a nivel de kernel),
      # así que no se puede publicar directo en la IP 100.x.x.x — hay
      # que publicar en todas las interfaces y es tailscaled quien
      # reenvía el tráfico del tailnet hacia aquí. Queda alcanzable por
      # LAN y tailnet; no expuesto a internet salvo que abras el puerto
      # en el router.
      - "${API_PORT:-8000}:${API_PORT:-8000}"

    volumes:
      # Películas/series — lectura Y escritura: mover un duplicado a la
      # papelera, renombrar huérfanos/episodios y crear ediciones de
      # Plex escriben (y borran) dentro de esta misma carpeta. Nunca se
      # borra nada directamente (ver "carpeta de debug" más abajo), pero
      # sí hace falta permiso de escritura para poder moverlo ahí.
      - "${MOVIES_PATH:-./test}:/movies"

      # Base de datos Plex (solo lectura) — luego configura
      # "/plex-db/com.plexapp.plugins.library.db" como ruta de Plex
      # desde la propia app (pestaña Configuración)
      - "${PLEX_DB_PATH:-./test}:/plex-db:ro"

      # Datos persistentes. config.json (rutas, IA, series ignoradas...)
      # vive dentro de esta carpeta gracias a CONFIG_PATH más abajo, así
      # que sobrevive a recrear el contenedor y nunca viaja horneado en
      # la imagen.
      - "${DATA_PATH:-./data}:/app/data"
      - "${LOGS_PATH:-./logs}:/app/logs"
      - "${SCAN_DATA_PATH:-./scan_data}:/app/scan_data"

    environment:
      - DOCKER_CONTAINER=true

      # 0.0.0.0 dentro del contenedor; el filtrado real de quién puede
      # llegar ocurre en el mapeo de puertos de arriba, no aquí.
      - API_SERVER_ADDRESS=0.0.0.0
      - API_PORT=${API_PORT:-8000}

      # config.json persistente en el volumen de datos, no en la imagen
      - CONFIG_PATH=/app/data/config.json

      # Zona horaria para que la hora del programador interno de Propuestas
      # (Configuración → 📅 Programación) coincida con tu hora real. Por
      # defecto Europe/Madrid (ya viene así en la imagen); cambia aquí si
      # no te vale.
      - TZ=${TZ:-Europe/Madrid}

      # Secretos — cada uno pasa por sustitución de Compose desde el
      # .env de al lado (Container Manager/CLI) o desde la sección
      # "Environment variables" de Portainer. Vacíos = esa integración
      # simplemente no se activa, no hace falta rellenarlos todos.
      - IMDB_API_KEY=${IMDB_API_KEY:-}
      - OMDB_API_KEY=${OMDB_API_KEY:-}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID:-}
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:-}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-}
      - TELEGRAM_PHONE=${TELEGRAM_PHONE:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SYNOLOGY_HOST=${SYNOLOGY_HOST:-}
      - SYNOLOGY_PORT=${SYNOLOGY_PORT:-5001}
      - SYNOLOGY_USER=${SYNOLOGY_USER:-}
      - SYNOLOGY_PASSWORD=${SYNOLOGY_PASSWORD:-}

    networks:
      - find-video-network

    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

networks:
  find-video-network:
    driver: bridge
